<!doctype html>
<!-- Copy to design/proposals/<NNN-slug>/mockups/<page>.html, then render with design/kit/render.py.

     change (vault-home-compact) or a new name for a new screen (vault-tags-compact). -->
<html lang="en"><head><meta charset="utf-8"><title>Proposal mockups</title>
<link rel="stylesheet" href="../../../kit/tokens.css"><link rel="stylesheet" href="../../../kit/base.css">
</head><body>
<!--ICONS-->

<!-- A changed screen, drawn over today's one. -->
<div class="frame compact" data-shot="vault-home-compact">
  <img class="base" src="../../../current/screens/vault-home-compact.png" alt="">
  <!-- what changes, positioned over it -->
</div>

<!-- A new screen, from scratch. -->
<div class="frame expanded" data-shot="new-screen-expanded">
  <svg class="ic"><use href="#i-search"/></svg>
</div>
</body></html>
