name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # shell.nix's Android SDK is unfree and license-gated; shell.nix allows both
  # in its own nixpkgs config, this covers anything evaluated outside it.
  NIXPKGS_ALLOW_UNFREE: 1

# Every job runs inside shell.nix, the same environment as local dev: JDK 21,
# the Rust toolchain (with its Android targets), the Android SDK/NDK, and the
# system libraries fyde-sdk's build needs. sdkBridge/rust depends on fyde-sdk
# from fyde-lab/sdk's master branch (pinned by Cargo.lock), which cargo fetches
# itself - no sibling checkout needed. The sdk's build.rs fetches its protos
# from the Buf Schema Registry (buf.build/fyde-lab/api) with shell.nix's `buf`.
#
# iOS isn't built: its targets only exist on macOS hosts (see
# sdkBridge/build.gradle.kts), and are built through Xcode.
jobs:
  bridge:
    name: sdkBridge (Rust)
    runs-on: ubuntu-latest
    steps:
      # fyde-sdk's dependency tree (wry/webkitgtk/BoringSSL) doesn't fit in
      # ubuntu-latest's free disk alongside its preinstalled toolchains - free
      # up the ones this job doesn't need (shell.nix brings its own Android SDK).
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          # cachix/install-nix-action doesn't set up NIX_PATH on its own, so
          # `<nixpkgs>` (used by shell.nix) fails to resolve without this.
          nix_path: nixpkgs=channel:nixos-unstable

      # shell.nix wires sccache in as RUSTC_WRAPPER, caching to ~/.cache/sccache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-bridge-${{ hashFiles('sdkBridge/rust/Cargo.lock') }}
          restore-keys: sccache-bridge-

      - name: cargo fmt --check
        working-directory: sdkBridge/rust
        run: nix-shell ../../shell.nix --run "cargo fmt --check"

      - name: cargo clippy
        working-directory: sdkBridge/rust
        run: nix-shell ../../shell.nix --run "cargo clippy --all-targets -- -D warnings"

      - name: cargo test
        working-directory: sdkBridge/rust
        run: nix-shell ../../shell.nix --run "cargo test"

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      # See the bridge job's comment on this step: assembleDebug cross-compiles
      # fyde-sdk for every Android ABI.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-android-${{ hashFiles('sdkBridge/rust/Cargo.lock') }}
          restore-keys: sccache-android-

      - uses: gradle/actions/setup-gradle@v4

      - name: Host tests
        run: nix-shell --run "./gradlew :shared:testAndroidHostTest"

      - name: Build debug APK
        run: nix-shell --run "./gradlew :androidApp:assembleDebug"

      - uses: actions/upload-artifact@v4
        with:
          name: fyde-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  desktop:
    name: Desktop (JVM)
    runs-on: ubuntu-latest
    steps:
      # See the bridge job's comment on this step.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-desktop-${{ hashFiles('sdkBridge/rust/Cargo.lock') }}
          restore-keys: sccache-desktop-

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: nix-shell --run "./gradlew :shared:jvmTest"

      - name: Build
        run: nix-shell --run "./gradlew :desktopApp:jar"

  web:
    name: Web (JS + Wasm)
    runs-on: ubuntu-latest
    # Web stubs FydeSdk, so nothing here builds Rust - and no free-disk-space
    # step, whose large-packages cleanup uninstalls the Chrome the browser
    # tests run in.
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: nix-shell --run "./gradlew :shared:jsTest :shared:wasmJsTest"

      - name: Build
        run: nix-shell --run "./gradlew :webApp:jsBrowserDevelopmentWebpack :webApp:wasmJsBrowserDevelopmentWebpack"
