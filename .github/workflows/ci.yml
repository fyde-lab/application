name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must stay in sync with gradle/libs.versions.toml's `androidx-ndk` /
  # android-ndk entry, and with shell.nix's rustToolchain target list.
  NDK_VERSION: "27.2.12479018"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The hosted runner's default image preinstalls toolchains (.NET,
      # Haskell, Docker images, etc.) this build never uses, leaving too
      # little free disk for Nix + the Android NDK + fyde-sdk's Rust build
      # artifacts combined (see the "No space left on device" failure this
      # step was added to fix). Keep the Android SDK, since we actually
      # need it.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # shared/sdkBridge builds fyde-sdk (../../sdk from this repo) via
      # UniFFI - see ../CLAUDE.md and sdkBridge/build.gradle.kts. Check out
      # sdk under the same workspace root as application so that relative
      # path resolves exactly like the local dev layout. Note api-protos is
      # NOT checked out here: sdk's build.rs fetches its protos at build
      # time via `buf export buf.build/fyde-lab/api` (the Buf Schema
      # Registry), not by reading a local ../api-protos checkout.
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: application

      - name: Checkout sdk
        uses: actions/checkout@v4
        with:
          repository: fyde-lab/sdk
          path: sdk

      # sdk's Cargo.toml dev-dependencies path-reference ../server (only
      # used by sdk's own tests/ to spin up a real server instead of
      # mocking it - see sdk/Cargo.toml) - but Cargo resolves the full
      # manifest, dev-dependencies included, even when only building the
      # library target, and errors out if a declared path dependency isn't
      # on disk. fyde-lab/server is private, so this needs a token with
      # read access to it (the default GITHUB_TOKEN only covers this repo).
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: fyde-lab/server
          path: server
          token: ${{ secrets.SERVER_CHECKOUT_TOKEN }}

      # shell.nix is the single source of truth for the Rust toolchain,
      # protoc, and the native libs sdk's wreq/wry dependencies need to
      # build (see application/shell.nix) - reuse it here instead of
      # reimplementing the same toolchain with separate GitHub Actions.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Caches sdk's Cargo registry/git deps and target dir, keyed off
      # sdk/Cargo.lock; cache-directories adds sccache's own cache since
      # rust-cache doesn't track it by default (see shell.nix's
      # RUSTC_WRAPPER).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk
          cache-directories: ~/.cache/sccache

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest images ship with an Android SDK (platforms/build-tools)
      # already installed, but not the specific NDK side-by-side version
      # sdkBridge's cargo integration cross-compiles fyde-sdk with.
      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}"

      # shell.nix's shellHook hardcodes ANDROID_HOME/ANDROID_SDK_ROOT to
      # $HOME/Android/Sdk for local dev (see application/shell.nix), which
      # would otherwise shadow the runner's real, pre-installed SDK once we
      # enter nix-shell below. Point that path at the real SDK instead of
      # changing shell.nix's local-dev behavior.
      - name: Link Android SDK to the path shell.nix expects
        run: |
          mkdir -p "$HOME/Android"
          ln -sfn "$ANDROID_HOME" "$HOME/Android/Sdk"

      - name: Run shared module tests
        working-directory: application
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          nix-shell --run '
            set -e
            ./gradlew :shared:testAndroidHostTest :shared:jvmTest :shared:wasmJsTest :shared:jsTest
          '

      - name: Check code quality (Android Lint)
        working-directory: application
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          nix-shell --run '
            set -e
            ./gradlew lint
          '

      - name: Build Android debug APK
        working-directory: application
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          nix-shell --run '
            set -e
            ./gradlew :androidApp:assembleDebug
          '

      - name: Build Desktop app
        working-directory: application
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          nix-shell --run '
            set -e
            ./gradlew :desktopApp:createDistributable
          '

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: application/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Desktop distributable
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: application/desktopApp/build/compose/binaries/main/app/
          retention-days: 7
